<style>
  :root{

    --ink-soft:#645B47;

  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

  /* ================= HERO ================= */
  .hero{
    position:relative;
    background:
      repeating-linear-gradient(115deg, rgba(224,168,46,.05) 0 1px, transparent 1px 68px),
      repeating-linear-gradient(25deg, rgba(224,168,46,.04) 0 1px, transparent 1px 90px),
      radial-gradient(ellipse at 25% 15%, #221D14 0%, var(--void) 55%);
    color:var(--paper);
    padding:70px 24px 150px;
    overflow:hidden;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--gold); text-align:center;
  }
  .hero h1{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:900;
    font-size:clamp(46px,9vw,104px);
    line-height:.98;
    text-align:center;
    margin:18px 0 0;
    letter-spacing:-.01em;
    text-shadow:0 0 40px rgba(224,168,46,.18);
  }
  .hero h1 .crackline{
    display:block;
    width:min(760px,86%);
    height:3px;
    margin:26px auto;
    background:linear-gradient(90deg, transparent, var(--gold) 15%, var(--ember) 50%, var(--gold) 85%, transparent);
    clip-path:polygon(0% 45%,6% 45%,9% 0%,13% 100%,18% 30%,24% 30%,28% 70%,33% 0%,40% 55%,46% 55%,50% 15%,55% 85%,61% 40%,67% 40%,72% 90%,78% 5%,84% 60%,89% 60%,93% 25%,100% 55%,100% 65%,93% 40%,89% 75%,84% 75%,78% 25%,72% 100%,67% 60%,61% 60%,55% 100%,50% 30%,46% 70%,40% 70%,33% 15%,28% 85%,24% 45%,18% 45%,13% 100%,9% 15%,6% 60%,0 60%);
    animation:glow 3.2s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ opacity:.75; filter:drop-shadow(0 0 6px rgba(224,168,46,.5)); }
    50%{ opacity:1; filter:drop-shadow(0 0 16px rgba(224,168,46,.8)); }
  }
  .manifesto{
    max-width:640px; margin:8px auto 0; padding:0 12px;
  }
  .manifesto p{
    font-size:15px; line-height:2.15;
    color:#D7CFB9;
    text-align:center; margin:0;
  }
  .manifesto strong{ color:var(--paper); font-weight:700; }
  .manifesto .line{
    display:block;
    position:relative;
  }
  .stats{
    display:flex; gap:0; justify-content:center;
    margin-top:46px; flex-wrap:wrap;
  }
  .stat{
    font-family:'Big Shoulders Display',sans-serif;
    text-align:center; padding:0 26px; border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat b{ display:block; font-size:44px; font-weight:900; color:var(--gold); line-height:1;}
  .stat span{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.15em;
    color:#9A8F72;
  }
  .tear{
    position:absolute; left:0; right:0; bottom:-2px; height:64px;
    background:var(--paper);
    clip-path:polygon(0 100%,3% 34%,7% 100%,10% 20%,13% 100%,16% 46%,20% 100%,23% 12%,27% 100%,30% 40%,34% 100%,37% 18%,41% 100%,44% 50%,48% 100%,51% 8%,55% 100%,58% 44%,62% 100%,65% 22%,69% 100%,72% 38%,76% 100%,79% 15%,83% 100%,86% 48%,90% 100%,93% 26%,97% 100%,100% 30%,100% 100%,0 100%);
  }

  /* ================= CONTROLS ================= */
  .controls{ max-width:1100px; margin:0 auto; padding:26px 24px 0; }
  .search-box{
    background:var(--void); color:var(--paper);
    border-radius:2px; padding:15px 18px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 8px 0 rgba(22,18,9,.12);
  }
  .search-box input{
    border:none; background:transparent; outline:none;
    font-size:15px; width:100%; color:var(--paper);
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .search-box input::placeholder{ color:#8A8067; }

  .filter-label{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:.15em; color:var(--ink-soft); margin:22px 2px 8px;
  }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    padding:7px 14px; border:1.5px solid var(--ink); border-radius:0;
    background:transparent; color:var(--ink); cursor:pointer;
  }
  .chip.active{ background:var(--ink); color:var(--gold); }
  .pref-row{ margin-top:10px; min-height:0; }
  .pref-row .chip{ border-color:var(--ink-soft); font-size:11px; padding:5px 11px; }
  .pref-row .chip.active{ background:var(--ember); border-color:var(--ember); color:var(--paper); }
  .type-row{ margin-top:16px; }
  .type-row .chip.active{ background:var(--ember); border-color:var(--ember); color:#fff; }

  .count-line{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--ink-soft); margin:20px 2px 0; border-top:1px solid rgba(22,18,9,.15); padding-top:14px;
  }

  /* ================= GRID (dossier cards) ================= */
  .grid{
    max-width:1100px; margin:0 auto; padding:22px 24px 100px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:22px 18px;
  }
  .card{
    background:var(--void); color:var(--paper);
    border:1px solid #000;
    position:relative; text-decoration:none; display:block;
    clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:translateY(-5px); box-shadow:0 14px 0 rgba(22,18,9,.15); }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 12px 0;
    font-family:'Big Shoulders Display',sans-serif; font-weight:900;
  }
  .card-no{ font-size:22px; color:var(--gold); line-height:1; }
  .card-pref{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px;
    color:var(--void); background:var(--ember);
    padding:3px 7px; letter-spacing:.05em; margin-top:2px;
  }
  .thumb{
    width:100%; aspect-ratio:16/9; margin-top:8px; overflow:hidden; position:relative; background:#000;
  }
  .thumb img{
    width:100%; height:100%; object-fit:cover;
    filter:none;
    mix-blend-mode:normal;
  }
  .short-tag{
    position:absolute; bottom:6px; left:0;
    background:var(--gold); color:var(--void);
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:10px;
    padding:2px 8px; letter-spacing:.05em;
  }
  .card h3{
    font-size:15px; line-height:1.5; font-weight:700;
    margin:12px 12px 6px;
  }
  .tags{
    margin:0 12px 12px; display:flex; gap:8px; flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace; font-size:10px; color:#B8AD8E;
  }
  .empty{
    text-align:center; padding:70px 20px; color:var(--ink-soft);

  }

    text-align:center; padding:30px; font-size:11px;
    color:var(--ink-soft); font-family:'JetBrains Mono',monospace;
    background:var(--paper-dim);
  }

    .stat{ padding:0 16px; }
    .stat b{ font-size:32px; }
    .hero{ padding:48px 18px 100px; }

    .controls{ padding:22px 16px 0; }
    .chip{ padding:8px 13px; font-size:12.5px; }
    .search-box{ padding:13px 15px; }
    .card-no{ font-size:20px; }
  }
</style>
</head>

VIDEOS.forEach((v,i)=>{ v.no = String(i+1).padStart(3,'0'); });

const grid = document.getElementById('grid');
const regionChipsEl = document.getElementById('regionChips');
const prefChipsEl = document.getElementById('prefChips');
const emptyMsg = document.getElementById('emptyMsg');
const countLine = document.getElementById('countLine');

let activeRegion = 'すべて';
let activePref = 'すべて';
let activeType = 'all';
let query = '';

const regionsInData = Array.from(new Set(VIDEOS.map(v=>v.region)));
const orderedRegions = REGION_ORDER.filter(r=>regionsInData.includes(r));
const extraRegions = regionsInData.filter(r=>!REGION_ORDER.includes(r));
const regionsPresent = ['すべて', ...orderedRegions, ...extraRegions];
regionChipsEl.innerHTML = regionsPresent.map(r=>
  `<button class="chip region-chip ${r==='すべて'?'active':''}" data-region="${r}">${r}</button>`
).join('');

document.getElementById('statTotal').textContent = VIDEOS.length;
document.getElementById('statPref').textContent = new Set(VIDEOS.map(v=>v.pref)).size;
document.getElementById('statTag').textContent = new Set(VIDEOS.flatMap(v=>v.tags)).size;

function renderPrefRow(){
  if(activeRegion === 'すべて'){ prefChipsEl.innerHTML = ''; return; }
  const prefs = ['すべて', ...Array.from(new Set(VIDEOS.filter(v=>v.region===activeRegion).map(v=>v.pref)))];
  prefChipsEl.innerHTML = prefs.map(p=>
    `<button class="chip pref-chip ${p===activePref?'active':''}" data-pref="${p}">${p}</button>`
  ).join('');
}

function render(){
  const filtered = VIDEOS.filter(v=>{
    const matchRegion = activeRegion==='すべて' || v.region===activeRegion;
    const matchPref = activePref==='すべて' || v.pref===activePref;
    const matchType = activeType==='all' || v.type===activeType;
    const q = query.trim();
    const matchQuery = !q || v.title.includes(q) || v.tags.some(t=>t.includes(q)) || v.pref.includes(q) || v.region.includes(q);
    return matchRegion && matchPref && matchType && matchQuery;
  });

  countLine.textContent = `${filtered.length} 件表示中 / 全 ${VIDEOS.length} 件`;
  emptyMsg.style.display = filtered.length ? 'none' : 'block';

  grid.innerHTML = filtered.map(v=>`
    <a class="card" href="${v.url}" target="_blank" rel="noopener">
      <div class="card-top">
        <span class="card-no">No.${v.no}</span>
        <span class="card-pref">${v.pref}</span>
      </div>
      <div class="thumb">
        <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" loading="lazy" alt="">
        ${v.type==='short' ? '<div class="short-tag">SHORT</div>' : ''}
      </div>
      <h3>${v.title}</h3>
      <div class="tags">${v.tags.map(t=>`#${t}`).join('　')}</div>
    </a>
  `).join('');
}

regionChipsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.region-chip');
  if(!btn) return;
  activeRegion = btn.dataset.region;
  activePref = 'すべて';
  document.querySelectorAll('.region-chip').forEach(c=>c.classList.toggle('active', c===btn));
  renderPrefRow();
  render();
});
prefChipsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.pref-chip');
  if(!btn) return;
  activePref = btn.dataset.pref;
  document.querySelectorAll('.pref-chip').forEach(c=>c.classList.toggle('active', c===btn));
  render();
});
document.getElementById('typeChips').addEventListener('click', e=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  activeType = btn.dataset.type;
  document.querySelectorAll('#typeChips .chip').forEach(c=>c.classList.toggle('active', c===btn));
  render();
});
document.getElementById('searchInput').addEventListener('input', e=>{
  query = e.target.value;
  render();
});

renderPrefRow();
render();
</script>
